# Local-only preview. Do not publish to a public host or bind 0.0.0.0.
services:
  badri-preview:
    build: .
    image: project-badri:local-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DevOnly__EnableIdentityHeaders: "true"
      ConnectionStrings__TradeDb: "Data Source=/data/tradeflow.dev.db"
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      - badri-preview-data:/data
volumes:
  badri-preview-data:
