name: Deploy Badri XML pilot to existing Azure App Service
on:
  push:
    branches:
      - feature/azure-identity-and-deployment-foundation
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-xml-azure-deploy.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: badri-xml-pilot-deploy
  cancel-in-progress: false

env:
  AZURE_TENANT_ID: e40f632c-d3b5-415e-bc51-7a06c131e0dd
  AZURE_SUBSCRIPTION_ID: 36ed0aa4-e3dd-404b-b210-4a6e4dc38c74
  AZURE_RESOURCE_GROUP: badritradersPOC
  AZURE_WEBAPP_NAME: badritraders
  EXPECTED_RESOURCE_ID: /subscriptions/36ed0aa4-e3dd-404b-b210-4a6e4dc38c74/resourceGroups/badritradersPOC/providers/Microsoft.Web/sites/badritraders

jobs:
  deploy:
    name: Publish XML test pilot (NOT production accounting)
    runs-on: ubuntu-latest
    environment: azure-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile pilot and package native .NET 10 App Service deployment
        run: |
          dotnet publish pilot/Badri.Pilot.csproj --configuration Release --output publish
          test -s publish/Badri.Pilot.dll
          test -s publish/wwwroot/index.html
          (cd publish && zip -qr ../badri-pilot.zip .)
      - name: Verify Azure federated credential is configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: bash
        run: |
          if [[ -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::Missing environment secret AZURE_CLIENT_ID in GitHub environment azure-pilot."
            echo "::error::Create Microsoft Entra app + GitHub OIDC federation for repo Muthukumar123/Project-Badri and environment azure-pilot."
            exit 1
          fi
      - name: Authenticate GitHub runner to existing Azure subscription through OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Validate App Service target, runtime and required private settings
        shell: bash
        run: |
          set -euo pipefail
          actual=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query id -o tsv)
          if [[ "${actual,,}" != "${EXPECTED_RESOURCE_ID,,}" ]]; then
            echo "::error::Azure resource ID mismatch; refusing deployment."
            exit 1
          fi
          runtime=$(az webapp config show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query linuxFxVersion -o tsv)
          if [[ "$runtime" != 'DOTNETCORE|10.0' ]]; then
            echo "::error::Expected built-in Linux DOTNETCORE|10.0; found $runtime."
            exit 1
          fi
          https=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query httpsOnly -o tsv)
          if [[ "$https" != 'true' ]]; then
            echo "::error::HTTPS-only is required; enable it in Azure before deploying."
            exit 1
          fi
          workers=$(az webapp config show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query numberOfWorkers -o tsv)
          if [[ "$workers" != '1' ]]; then
            echo "::error::XML pilot requires exactly one App Service instance."
            exit 1
          fi
          settings=$(az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query '[].name' -o tsv)
          for setting in BADRI_XML_PATH BADRI_PASS_OWNER BADRI_PASS_ACCOUNTS BADRI_PASS_WAREHOUSE BADRI_PASS_SALESMAN BADRI_PASS_RETAILER BADRI_PASS_OPERATOR ASPNETCORE_ENVIRONMENT; do
            if ! grep -Fxq "$setting" <<<"$settings"; then
              echo "::error::Missing required Azure App Setting name $setting. No passwords will be printed."
              exit 1
            fi
          done
          # The Free F1 tier is an evaluation-only plan; this does NOT upgrade it.
          echo 'Target verified: badritraders, South India, .NET 10, single instance.'
      - name: Deploy compiled pilot ZIP to this existing App Service
        shell: bash
        run: |
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --src-path badri-pilot.zip --type zip --clean true
      - name: Validate HTTPS, UI, API health and anonymous access isolation
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query defaultHostName -o tsv)
          url="https://$host"
          ready=0
          for i in {1..30}; do
            if curl --max-time 15 -fsS "$url/health" -o /tmp/badri-health.json \
               && grep -q '"version":"pilot-r1"' /tmp/badri-health.json; then ready=1; break; fi
            sleep 10
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Azure health probe never returned Badri pilot version pilot-r1."
            exit 1
          fi
          curl --max-time 15 -fsS "$url/" | grep -q 'Badri TradeFlow'
          status=$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' "$url/api/state")
          if [[ "$status" != "401" ]]; then
            echo "::error::Anonymous financial API must return HTTP 401, got HTTP $status."
            exit 1
          fi
          echo "Azure XML pilot URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub feature branch: feature/azure-identity-and-deployment-foundation" >> "$GITHUB_STEP_SUMMARY"
          echo "Safety: Historical document totals are review-only; not confirmed posted balances." >> "$GITHUB_STEP_SUMMARY"
