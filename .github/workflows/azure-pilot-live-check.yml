name: Verify live Badri XML pilot logins (read-only)
on:
  push:
    branches:
      - feature/azure-identity-and-deployment-foundation
    paths:
      - '.github/workflows/azure-pilot-live-check.yml'
      - 'tools/check_live_pilot.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure OIDC sign-in for read-only credentials verification
        uses: azure/login@v2
        with:
          client-id: 0b055085-26ad-4dbb-817b-6ee7a6c2d52a
          tenant-id: e40f632c-d3b5-415e-bc51-7a06c131e0dd
          subscription-id: 36ed0aa4-e3dd-404b-b210-4a6e4dc38c74
      - name: Verify public pilot version, unauthorized access and six unique role accounts
        run: python3 tools/check_live_pilot.py
