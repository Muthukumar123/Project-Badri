name: preview-container-build
on:
  pull_request:
    paths:
      - Dockerfile
      - compose.preview.yml
      - .dockerignore
      - src/**
      - web/**
      - .github/workflows/container-preview-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-no-deploy:
    name: Build localhost-only preview image (does NOT deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build integrated .NET + React image (never push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: project-badri:ci-preview
      - name: Smoke test bundled API + React UI over localhost
        shell: bash
        run: |
          docker run -d --rm --name badri-preview-ci \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e 'DevOnly__EnableIdentityHeaders=true' \
            -e 'ConnectionStrings__TradeDb=Data Source=/data/tradeflow.dev.db' \
            -p 127.0.0.1:5090:8080 project-badri:ci-preview
          trap 'docker logs badri-preview-ci; docker rm -f badri-preview-ci || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5090/health > /tmp/badri-health.json; then break; fi
            sleep 1
          done
          grep -q 'DEVELOPMENT_ONLY' /tmp/badri-health.json
          curl --fail --silent http://127.0.0.1:5090/ | grep -q 'root'
      - name: Verify production never accepts spoofable demo headers
        run: |
          grep -F 'if (!development) api.RequireAuthorization();' src/TradeFlow.Api/Program.cs
          grep -F 'if (!config.GetValue<bool>("DevOnly:EnableIdentityHeaders")) return null;' src/TradeFlow.Api/Identity.cs
          grep -F '127.0.0.1:5090:8080' compose.preview.yml
