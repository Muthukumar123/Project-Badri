name: Recover and verify Badri website (3-role pilot)
on:
  push:
    branches: [feature/azure-identity-and-deployment-foundation]
    paths:
      - '.github/workflows/ensure-badri-website-live.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: badri-xml-pilot-azure
  cancel-in-progress: false

env:
  RESOURCE_GROUP: badritradersPOC
  APP_NAME: badritraders
  EXPECTED_ID: /subscriptions/36ed0aa4-e3dd-404b-b210-4a6e4dc38c74/resourceGroups/badritradersPOC/providers/Microsoft.Web/sites/badritraders

jobs:
  recover:
    name: Redeploy prebuilt .NET pilot and verify live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish exact Badri pilot project, verify packaged UI
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish pilot/Badri.Pilot.csproj -c Release -o publish
          test -s publish/Badri.Pilot.dll
          test -s publish/wwwroot/index.html
          test -s publish/wwwroot/app.js
          test -s publish/wwwroot/style.css
          node --check publish/wwwroot/app.js
          grep -Fq 'Badri TradeFlow' publish/wwwroot/index.html
          (cd publish && zip -qr ../badri-three-role.zip .)
      - name: Login to owner's Azure using existing GitHub OIDC identity
        uses: azure/login@v2
        with:
          client-id: 0b055085-26ad-4dbb-817b-6ee7a6c2d52a
          tenant-id: e40f632c-d3b5-415e-bc51-7a06c131e0dd
          subscription-id: 36ed0aa4-e3dd-404b-b210-4a6e4dc38c74
      - name: Validate destination and check current site before deploying
        shell: bash
        run: |
          set -euo pipefail
          actual=$(az webapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query id -o tsv)
          [[ "${actual,,}" == "${EXPECTED_ID,,}" ]] || { echo "::error::Wrong Azure resource ID"; exit 1; }
          runtime=$(az webapp config show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query linuxFxVersion -o tsv)
          [[ "$runtime" == 'DOTNETCORE|10.0' ]] || { echo "::error::Unexpected runtime $runtime"; exit 1; }
          host=$(az webapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query defaultHostName -o tsv)
          echo "Host from Azure: $host"
          state=$(az webapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query state -o tsv)
          echo "Azure control-plane state before redeploy: $state"
          for route in / /health /app.js?v=2 /style.css?v=2; do
            code=$(curl -L --max-time 20 -s -o /dev/null -w '%{http_code}' "https://$host$route" || true)
            echo "Before: $route returned HTTP $code"
          done
      - name: Fresh ZIP deploy to existing App Service — no database deletion
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --src-path ./badri-three-role.zip --type zip --clean true --track-status false
          echo "Redeployed compiled pilot. Persistent XML remains outside /home/site/wwwroot."
      - name: Confirm actual public app (not Azure placeholder) and browser assets
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query defaultHostName -o tsv)
          url="https://$host"
          ready=0
          for n in $(seq 1 24); do
            code=$(curl --max-time 20 -L -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$url/health" || true)
            if [[ "$code" == 200 ]] && grep -Eq '"version"[[:space:]]*:[[:space:]]*"pilot-r2"' "$RUNNER_TEMP/health.json"; then
              ready=1; break
            fi
            echo "App warming /health: HTTP $code, attempt $n/24"
            sleep 10
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Azure app did not serve Badri pilot-r2 health within readiness period."
            exit 1
          fi
          curl -L --fail --max-time 30 -sS "$url/" -o "$RUNNER_TEMP/index.html"
          grep -Fq 'Badri TradeFlow | Simple daily trade' "$RUNNER_TEMP/index.html" || {
            echo "::error::Root returned unexpected HTML, possibly Azure placeholder"; exit 1; }
          if grep -Fq 'Your web app is running and waiting for your content' "$RUNNER_TEMP/index.html"; then
            echo "::error::Azure default placeholder is still being served"; exit 1
          fi
          curl -L --fail --max-time 30 -sS "$url/app.js?v=2" -o "$RUNNER_TEMP/app.js"
          curl -L --fail --max-time 30 -sS "$url/style.css?v=2" -o "$RUNNER_TEMP/style.css"
          node --check "$RUNNER_TEMP/app.js"
          test "$(wc -c < "$RUNNER_TEMP/app.js")" -gt 10000
          test "$(wc -c < "$RUNNER_TEMP/style.css")" -gt 5000
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url/api/state")
          [[ "$code" == 401 ]] || { echo "::error::Protected endpoint returned HTTP $code, expected 401."; exit 1; }
          echo "PASS: Actual Badri TradeFlow index, JS, CSS, health-r2 and protected API."
          echo "Website: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify all three real App Service login roles (read-only)
        shell: bash
        run: python3 tools/check_live_pilot.py
      - name: Report public URL and current deployment commit
        shell: bash
        run: |
          echo "### Badri TradeFlow is deployed and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Login:** owner, salesperson, retailer" >> "$GITHUB_STEP_SUMMARY"
          echo "**Data:** Existing XML file retained; no new accounting records created." >> "$GITHUB_STEP_SUMMARY"
